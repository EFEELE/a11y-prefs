<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>new preferences</title>
<style>
  body{font:16px/1.6 system-ui,sans-serif;margin:0;padding:0 20px 80px}
  .bar{position:fixed;top:0;left:0;right:0;padding:10px 20px;background:#12203f;color:#fff;z-index:5}
  .sidebar-sticky{position:sticky;top:60px;padding:8px;background:#eef}
  main{padding-top:60px}
  input,select,textarea{padding:6px;border:1px solid #ddd}
</style></head>
<body>
  <header class="bar">Fixed bar</header>
  <main>
    <div class="sidebar-sticky">Sticky block</div>
    <p><a href="#local">Internal link</a> ·
       <a href="https://example.com" target="_blank" rel="noopener">External link</a></p>
    <p>Text to select for the selection colour test.</p>
    <form><input type="text" value="input"> <select><option>select</option></select>
      <textarea rows="2">textarea</textarea> <button type="button">button</button></form>
  </main>
<a11y-prefs storage-key="new-features-demo"></a11y-prefs>
<script src="../dist/a11y-prefs.js" data-auto="false" defer></script>
</body></html>
